<h1 mat-dialog-title>Add Same As</h1>
<form mat-dialog-content class="object-property-overlay-form">
    <!-- value -->
    <iri-select-ontology [(selected)]="propertyValue" [selectList]="individuals"
                         displayText="Individuals" [singleSelect]="true"></iri-select-ontology>
</form>
<div mat-dialog-actions class="object-property-overlay-actions">
    <button mat-raised-button [mat-dialog-close]="false">Cancel</button>
    <button mat-raised-button color="primary" (click)="addProperty()"
            [disabled]="!propertyValue.length">Submit</button>
</div>
