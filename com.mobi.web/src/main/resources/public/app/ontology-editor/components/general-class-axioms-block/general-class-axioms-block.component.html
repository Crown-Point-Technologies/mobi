  <div class="axiom-block">
    <div class="section-header">
        <h5>General Class Axioms</h5>
        <a *ngIf="os.listItem.selected && !os.isSelectedImported() && os.canModify()"
           class="float-right fa fa-fw fa-plus" (click)="this.showAxiomOverlay()"></a>
    </div>
    <div class="class-axioms">
        <div class="property-values mt-3">
<div *ngFor="let value of values; let i =  index" class="prop-value-container d-flex p-1 ml-3 mt-1">
    <blank-node-value-display [node]="value">
    </blank-node-value-display>
    <div class="button-container d-flex">
        <button  mat-icon-button color="primary" (click)="openRemoveGCAOverlay(value,i)" title="Delete">
            <mat-icon>delete</mat-icon>
        </button>
        <button  mat-icon-button color="primary" (click)="openEditGCAOverlay(value,i)" title="Edit">
            <mat-icon>edit</mat-icon>
        </button>
    </div>
</div>
</div>
    </div>
</div>
