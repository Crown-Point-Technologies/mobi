<div class="annotation-block">
    <div class="section-header">
        <h5>Property Chain</h5><a class="float-right fa fa-fw fa-plus" (click)="openAddOverlay()"></a>
    </div>

        <ul *ngFor="let p of propMap; index as i;" class="property-values mt-3 d-flex">
            <li class="prop-value-container d-flex flex-wrap p-1 ml-3 mt-1 col-10">{{p}}</li>
            <div class="button-container col-3">
                <button  mat-icon-button color="primary"
                         (click)="openRemoveOverlay(i, p)"
                         title="Delete"><mat-icon>delete</mat-icon></button>
                <button  mat-icon-button color="primary"
                         (click)="editClicked(i, p)"
                         title="Edit"><mat-icon>edit</mat-icon></button>
            </div>
        </ul>
</div>
