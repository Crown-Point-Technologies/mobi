<div class="object-property-block">
    <div class="section-header">
        <h5>Same As</h5>
        <a *ngIf="!os.isSelectedImported() && os.canModify()"
           (click)="openAddSameAsOverlay()"
           class="float-right fa fa-fw fa-plus">
        </a>
    </div>

    <div class="property-values">
        <div class="prop-value-container d-flex p-1 ml-3 mt-1"
             *ngFor="let value of property; index as $index">
            <span *ngIf="os.isLinkable(value);"
                  class="value-display-wrapper flex-1 remove-min-width">
                {{os.getEntityNameByListItem(value)}}
                <small>&lt;<a (click)="os.goTo(value)">{{value}}</a>&gt;</small>
            </span>
            <div class="button-container">
                <button mat-icon-button color="primary" (click)="showRemovePropertyOverlay(value, $index)"
                        title="Delete"><mat-icon>delete</mat-icon>
                </button>
            </div>
        </div>
    </div>
</div>
