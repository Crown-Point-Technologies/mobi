<h1 mat-dialog-title>Edit Types</h1>
<div mat-dialog-content>
    <error-display *ngIf="errorMessage">{{errorMessage}}</error-display>
    <mat-tab-group dynamicHeight="true" class="h-100" [(selectedIndex)]="tabIndex">
        <mat-tab label="List" >
            <ng-template matTabContent>
                <ontology-class-select [selected]="types" [extraOptions]="[namedIndividualIri]" displayText="Values"></ontology-class-select>
            </ng-template>
        </mat-tab>
        <mat-tab label="Editor" >
            <ng-template matTabContent>
                <div class="field-label">Expression</div>
                <div class="codemirror-wrapper" [ngClass]="{'readOnly': editorOptions.readOnly}">
                    <ngx-codemirror [(ngModel)]="expression" [options]="editorOptions"></ngx-codemirror>
                </div>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</div>
<div mat-dialog-actions>
    <button mat-raised-button [mat-dialog-close]="false">Cancel</button>
    <button mat-raised-button color="primary" (click)="addType()" [disabled]="(tabIndex === 0 && !types.length) || (tabIndex === 1 && !expression)">Submit</button>
</div>
