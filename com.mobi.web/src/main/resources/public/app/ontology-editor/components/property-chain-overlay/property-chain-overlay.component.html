<h1 mat-dialog-title>Add Property</h1>
<div mat-dialog-content>
    <div class="input-container">
    <mat-form-field class="w-100">
    <mat-label>Property</mat-label>
        <input type="text" matInput placeholder="Enter Property" [formControl]="propertyChain"/>
    </mat-form-field>
        <button mat-icon-button (click)="addPropertyInputField()">
            <mat-icon>add</mat-icon>
        </button>
    </div>
    <div *ngFor="let additionalInput of additionalInputs; let i = index">
        <div class="input-container">
        <mat-form-field class="w-100">
            <mat-label>Property</mat-label>
            <input type="text" matInput placeholder="Enter Property" [formControl]="additionalInput"/>
        </mat-form-field>
            <button mat-icon-button (click)="removePropertyInputField(i)">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </div>
</div>

<div mat-dialog-actions>
    <button mat-raised-button [mat-dialog-close]="false">Cancel</button>
    <button mat-raised-button color="primary" [disabled]="!isPropertyFormValid()" >Submit</button>
</div>
