<div class="datatype-property-block">
    <div class="section-header">
        <h5>Negative Object Property Assertions</h5>
        <a *ngIf="!os.isSelectedImported() && os.canModify()"
           (click)="openAddNegativeObjectPropOverlay()" class="float-right fa fa-fw fa-plus"></a>
    </div>

        <div class="property-values mt-3" *ngFor="let prop of datas; index as $index">
            <div class="prop-header d-flex align-items-baseline clearfix" *ngIf="prop[assertionProperty]  && prop[targetIndividual]">
                <p class="text text-truncate m-0" *ngIf="prop[assertionProperty] && prop[assertionProperty][0]" title="{{prop[assertionProperty][0]['@id']}}">{{os.getEntityNameByListItem(prop[assertionProperty][0]["@id"], os.listItem)}}</p>
                <small class="ml-1 text-muted text-truncate flex-1" *ngIf="prop[assertionProperty] && prop[assertionProperty][0]">&lt;{{prop[assertionProperty][0]['@id']}}&gt;</small>
            </div>

            <div class="prop-value-container d-flex p-1 ml-3 mt-1" *ngIf="prop[assertionProperty] && prop[targetIndividual]">
                <span class="value-display-wrapper flex-1 remove-min-width">
                    {{os.getEntityNameByListItem(prop[targetIndividual][0]["@id"])}}
                    <small>
                    &lt;<a (click)="os.goTo(prop[targetIndividual][0]['@id'])">{{prop[targetIndividual][0]["@id"]}}</a>&gt;
                    </small>
                </span>
                <div class="button-container">
                    <button mat-icon-button color="primary" (click)="showRemovePropertyOverlay(prop,$index)" title="Delete"><mat-icon>delete</mat-icon></button>
                </div>
            </div>
        </div>
</div>
